name: Release

# Pushing a tag vX.Y.Z (matching VERSION) builds the release files and attaches
# them to a draft release. The draft is published by hand once its notes are
# written.
'on':
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check the tag matches VERSION
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VERSION ($version)" }

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Wails version from go.mod' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed' }

      - name: Build the release files
        run: .\build.ps1 -Target release

      - name: Create a draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = (Get-ChildItem -LiteralPath build\release -File).FullName
          gh release create $env:TAG $files --draft --title $env:TAG --notes 'Draft: write the release notes (English first, then Traditional Chinese) before publishing.'
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed' }
